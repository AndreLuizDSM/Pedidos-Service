# Configuração exclusiva dos testes: banco H2 em memÃ³ria.
# Evita depender de um PostgreSQL externo (que não existe no CI),
# permitindo que o @SpringBootTest suba o contexto sozinho.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop: cria o schema ao subir e descarta ao final de cada execução
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Necessário porque o @Scheduled (OrderExpirationScheduler) resolve este placeholder no startup
cron.horario=0 0/10 * * * ?
