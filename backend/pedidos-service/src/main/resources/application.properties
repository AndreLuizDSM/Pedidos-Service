spring.application.name=pedidos

spring.datasource.url=jdbc:postgresql://localhost:5432/db_pedidos
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

cron.horario=0 0/10 * * * ?

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Retry com backoff exponencial para os @RabbitListener: em caso de falha (ex: SMTP fora do ar),
# tenta de novo ate 3x (1s, depois 2s) antes de desistir definitivamente da mensagem.
# Sem isso, qualquer exceçao no listener faria o RabbitMQ reentregar a mensagem indefinidamente.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=andre.teste.notificacao@gmail.com
spring.mail.password=${EMAIL_APP_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.thymeleaf.enabled=true

envio.email.remetente=andre.teste.notificacao@gmail.com
envio.email.nomeRemetente=Andre Luiz
