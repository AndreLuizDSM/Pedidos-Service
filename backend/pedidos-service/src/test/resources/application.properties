# Configuraçao exclusiva dos testes: banco H2 em memoria.
# Evita depender de um PostgreSQL externo (que nao existe no CI),
# permitindo que o @SpringBootTest suba o contexto sozinho.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop: cria o schema ao subir e descarta ao final de cada execuçao
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Necessario porque o @Scheduled (OrderExpirationScheduler) resolve este placeholder no startup
cron.horario=0 0/10 * * * ?

# Necessario para o Spring Boot autoconfigurar o bean JavaMailSender (exigido pelo MailSenderAdapter).
# Como o contextLoads() so sobe o contexto e nao envia e-mail de fato, um host fake suficiente.
spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=test

envio.email.remetente=test@test.com
envio.email.nomeRemetente=Teste
